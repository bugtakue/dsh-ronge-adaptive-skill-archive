name: publish

# 打 tag（v*）时：跑测试 → 校验 tag 与 package.json 版本一致 → 发布到 npm（provenance）。
# 需要在仓库 Secrets 里配置 NPM_TOKEN（npm 自动化 token，2FA bypass）。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm run check
      - run: npm test
      - name: verify tag matches package.json version
        run: |
          node -e "const p=require('./package.json');const t=(process.env.GITHUB_REF_NAME||'').replace(/^v/,'');if(p.version!==t){console.error('tag/version mismatch:',t,'vs',p.version);process.exit(1)}"
      - name: verify market index is current
        run: |
          node scripts/build-market-index.mjs
          git diff --exit-code -- docs/plugin-market.json || (echo 'docs/plugin-market.json is stale; rerun npm run build:market-index' && exit 1)
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
