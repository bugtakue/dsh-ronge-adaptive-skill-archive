name: publish

# 打 tag（v*）时：跑测试 → 校验 tag 与 package.json 版本一致 → 发布到 npm（provenance）。
# 需要在仓库 Secrets 里配置 NPM_TOKEN（npm 自动化 token，2FA bypass）。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm run check
      - run: npm test
      - name: verify tag matches package.json version
        id: version
        run: |
          VERSION=$(node -e "process.stdout.write(require('./package.json').version)")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION; legacy tag, tests only."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: verify market index is current
        if: steps.version.outputs.skip == 'false'
        run: |
          node scripts/build-market-index.mjs
          git diff --exit-code -- docs/plugin-market.json || (echo 'docs/plugin-market.json is stale; rerun npm run build:market-index' && exit 1)
      # 迁移到 Trusted Publishing (OIDC) 后，可把下面的 NODE_AUTH_TOKEN 清空并删除 secret；
      # 步骤见 docs/trusted-publishing.md。
      - name: publish to npm (skipped when NPM_TOKEN is not configured)
        if: steps.version.outputs.skip == 'false'
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN secret is not configured; skipping npm publish."
            exit 0
          fi
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: deprecate the old package name
        if: steps.version.outputs.skip == 'false'
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN secret is not configured; skipping old-package deprecation."
            exit 0
          fi
          npm deprecate "ronge-adaptive-skill-archive@*" "Renamed to dsh-ronge-adaptive-skill-archive. Use: plugin_manager install_bundle target=dsh-ronge-adaptive-skill-archive@3.0.0" || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: ensure latest dist-tag points at this version
        if: steps.version.outputs.skip == 'false'
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN secret is not configured; skipping dist-tag update."
            exit 0
          fi
          VERSION=$(node -e "process.stdout.write(require('./package.json').version)")
          npm dist-tag add "dsh-ronge-adaptive-skill-archive@$VERSION" latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
